<!DOCTYPE html>
<html lang="en">
<head>

  <title>Welcome to YuuZone.fun</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);

      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    header {
      background: #293241;

      padding: 2rem;
      border-radius: 0 0 12px 12px;

      max-width: 480px;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5em 0;
      font-size: 2.2em;
    }
    p {
      color: #3d5a80;
      margin: 1em 0;
      font-size: 1.15em;
    }
    .footer {
      margin-top: 2em;
      color: #7c8896;
      font-size: 0.95em;
    }
    @media (max-width: 600px) {
      main {
        padding: 1rem;
